services:
  # ── Backend Node.js Express Web Service ────────────────────────────────────
  - type: web
    name: ticket-booking-backend
    rootDir: backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        value: mongodb+srv://ghansu:ticketapp2026@cluster0.mfyolnz.mongodb.net/ticket-booking?appName=Cluster0
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false

  # ── Frontend React (Vite) Static Site ─────────────────────────────────────
  - type: web
    name: ticket-booking-frontend
    rootDir: frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
